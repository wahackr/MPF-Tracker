name: Test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r crawler/worker/requirements.txt
      - run: python -m pytest -q -m "not integration and not live"

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [crawler/api, portfolio, purchase, valuation]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - run: npm test
        working-directory: ${{ matrix.service }}

  integration:
    runs-on: ubuntu-latest
    needs: [python, typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r crawler/worker/requirements.txt
      - run: python -m pytest -q -m integration
