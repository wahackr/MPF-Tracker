name: Deploy MPF Tracker to prod (Docker Compose)

on:
  push:
    branches: [master]
    paths:
      - src/**
      - deploy/**
      - .github/workflows/deployment-prod-pipeline.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpf-tracker-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    environment: prod
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'mpf-tracker-prod' }}
      MPF_INTERNAL_NETWORK: ${{ vars.MPF_INTERNAL_NETWORK || 'mpf-tracker-prod-internal' }}
      DB_MODE: ${{ vars.DB_MODE || 'shared' }}
      DEPLOY_DOCKER_CONTEXT: prod
      API_KEY: ${{ secrets.API_KEY }}
      TZ: Asia/Hong_Kong
      API_BIND_ADDRESS: ${{ vars.API_BIND_ADDRESS || '0.0.0.0' }}
      CRAWLER_API_HOST_PORT: ${{ vars.CRAWLER_API_HOST_PORT || '8001' }}
      PORTFOLIO_API_HOST_PORT: ${{ vars.PORTFOLIO_API_HOST_PORT || '8002' }}
      PURCHASE_API_HOST_PORT: ${{ vars.PURCHASE_API_HOST_PORT || '8003' }}
      VALUATION_API_HOST_PORT: ${{ vars.VALUATION_API_HOST_PORT || '8004' }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'mpf_prod' }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_BIND_ADDRESS: ${{ vars.POSTGRES_BIND_ADDRESS || '127.0.0.1' }}
      POSTGRES_HOST_PORT: ${{ vars.POSTGRES_HOST_PORT || '5432' }}
      POSTGRES_DATA_DIR: ${{ vars.POSTGRES_DATA_DIR }}
      SHARED_POSTGRES_HOST: ${{ vars.SHARED_POSTGRES_HOST }}
      SHARED_POSTGRES_PORT: ${{ vars.SHARED_POSTGRES_PORT || '5432' }}
      CRAWLER_DB_USER: ${{ vars.CRAWLER_DB_USER || 'mpf_prod_crawler' }}
      CRAWLER_DB_PASSWORD: ${{ secrets.CRAWLER_DB_PASSWORD }}
      PORTFOLIO_DB_USER: ${{ vars.PORTFOLIO_DB_USER || 'mpf_prod_portfolio' }}
      PORTFOLIO_DB_PASSWORD: ${{ secrets.PORTFOLIO_DB_PASSWORD }}
      PURCHASE_DB_USER: ${{ vars.PURCHASE_DB_USER || 'mpf_prod_purchase' }}
      PURCHASE_DB_PASSWORD: ${{ secrets.PURCHASE_DB_PASSWORD }}
      VALUATION_DB_USER: ${{ vars.VALUATION_DB_USER || 'mpf_prod_valuation' }}
      VALUATION_DB_PASSWORD: ${{ secrets.VALUATION_DB_PASSWORD }}
      WORKER_POLL_INTERVAL_SECONDS: ${{ vars.WORKER_POLL_INTERVAL_SECONDS || '2' }}
      WORKER_LEASE_SECONDS: ${{ vars.WORKER_LEASE_SECONDS || '90' }}
      WORKER_HEARTBEAT_SECONDS: ${{ vars.WORKER_HEARTBEAT_SECONDS || '15' }}
      N8N_NETWORK: ${{ vars.N8N_NETWORK || 'mpf-tracker-prod-automation' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Skip superseded commits
        id: current
        uses: actions/github-script@v9
        with:
          script: |
            const isCurrent = require('./deploy/tools/deployment-current.cjs');
            core.setOutput('deploy', String(await isCurrent({ github, context, branch: 'master' })));

      - name: Validate deployment configuration
        if: steps.current.outputs.deploy == 'true'
        run: bash deploy/tools/deploy.sh validate

      - name: Build application images
        if: steps.current.outputs.deploy == 'true'
        run: bash deploy/tools/deploy.sh build

      - name: Recheck branch before deployment
        id: ready
        if: steps.current.outputs.deploy == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const isCurrent = require('./deploy/tools/deployment-current.cjs');
            core.setOutput('deploy', String(await isCurrent({ github, context, branch: 'master' })));

      - name: Deploy and check readiness
        if: steps.ready.outputs.deploy == 'true'
        run: bash deploy/tools/deploy.sh deploy
