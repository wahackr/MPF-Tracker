name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 23 * * *"

jobs:
  python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r crawler/worker/requirements.txt
      - run: python -m pytest -q -m "not integration"

  typescript:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [crawler/api, portfolio, purchase, valuation]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - run: npm test
        working-directory: ${{ matrix.service }}

  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [python, typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r crawler/worker/requirements.txt
      - run: python -m pytest -q -m integration

  manulife-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r crawler/worker/requirements.txt
      - run: python -m pytest -q -ra crawler/worker/src/__tests__/live/test_manulife_live.py
