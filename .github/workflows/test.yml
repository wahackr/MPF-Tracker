name: Test

on:
  push:
  pull_request:

jobs:
  tests:
    name: Sequential test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/crawler/api/package-lock.json
            src/portfolio/backend/package-lock.json
            src/purchase/package-lock.json
            src/valuation/package-lock.json

      - name: Test deployment tooling
        run: node --test deploy/tools/*.test.cjs

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Docker
        run: |
          docker info > /dev/null
          docker compose version

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r src/crawler/worker/requirements.txt

      # Each suite must pass before the next suite starts.
      - name: Test crawler worker (Python)
        run: python -m pytest -q -ra --cov=src/crawler/worker/src --cov-branch --cov-report=term-missing

      - name: Install crawler API dependencies
        run: npm ci
        working-directory: src/crawler/api

      - name: Test crawler API
        run: npm test
        working-directory: src/crawler/api

      - name: Install portfolio dependencies
        run: npm ci
        working-directory: src/portfolio/backend

      - name: Test portfolio
        run: npm test
        working-directory: src/portfolio/backend

      - name: Install purchase dependencies
        run: npm ci
        working-directory: src/purchase

      - name: Test purchase
        run: npm test
        working-directory: src/purchase

      - name: Install valuation dependencies
        run: npm ci
        working-directory: src/valuation

      - name: Test valuation
        run: npm test
        working-directory: src/valuation
