name: Live Provider Endpoints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r crawler/worker/requirements.txt
      - run: python -m pytest -q -ra -m live
